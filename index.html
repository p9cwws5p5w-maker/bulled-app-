<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bulled</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0a;--card:#121212;--card-2:#171717;--border:#222;--border-2:#2c2c2c;
  --text:#f5f5f5;--sub:#8e8e8e;--faint:#5c5c5c;--field:#1a1a1a;
  --gold:#f5b300;--gold-ink:#f5b300;--gold-bg:#1d1707;--gold-line:#3a300f;
  --up:#22c55e;--down:#f04444;--up-bg:#0f2418;--down-bg:#2a1111;--warn:#facc15;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit}
a{color:var(--gold-ink)}
header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:20px;font-weight:800;letter-spacing:-.02em}.logo span{color:var(--gold)}
.btn{background:var(--gold);color:#000;border:0;padding:10px 14px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--field);color:var(--text);border:1px solid var(--border-2)}
.btn.sell{background:var(--down);color:#fff}
.btn.full{width:100%;padding:14px;font-size:15px}
.wallet{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--border-2);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;cursor:pointer}
.wallet .dot{width:8px;height:8px;border-radius:50%;background:var(--up)}
.wallet small{color:var(--sub);font-weight:600}
main{max-width:720px;margin:0 auto;padding:12px 16px 30px}
.search{display:flex;gap:8px;margin:4px 0 12px}
input,select{width:100%;background:var(--field);border:1px solid var(--border-2);color:var(--text);padding:11px 12px;border-radius:10px;font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:var(--gold)}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tab{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap;font-weight:600}
.tab.on{background:var(--gold);border-color:var(--gold);color:#000;font-weight:800}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.row:active{border-color:var(--border-2)}
.av{width:40px;height:40px;border-radius:50%;background:var(--field);flex-shrink:0;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold)}
.grow{flex:1;min-width:0}
.nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{color:var(--sub);font-weight:500;font-size:13px;margin-left:4px}
.meta{color:var(--sub);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{text-align:right;flex-shrink:0}
.px b{display:block;font-size:14px}
.chg{font-size:12px;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}
.empty{text-align:center;color:var(--sub);padding:36px 16px;font-size:14px;line-height:1.5}
.note{background:var(--gold-bg);border:1px solid var(--gold-line);color:#e9dfbf;border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:12px}
.note.warn{background:var(--down-bg);border-color:#4a1d1d;color:#f6c9c9}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));position:relative}
.x{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--sub);font-size:24px;cursor:pointer}
.tk-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-right:30px}
.tk-head h2{margin:0;font-size:19px}
.tk-price{font-size:26px;font-weight:800;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.st{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px}
.st .l{font-size:11px;color:var(--sub)}.st .v{font-size:14px;font-weight:700;margin-top:2px}
.chart{width:100%;height:340px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.chart iframe{width:100%;height:100%;border:0}
.risk{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin:12px 0;font-size:13px}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.pill.good{background:var(--up-bg);color:var(--up)}.pill.mid{background:#2a2208;color:var(--warn)}.pill.bad{background:var(--down-bg);color:var(--down)}
.risk ul{margin:6px 0 0;padding-left:18px;color:var(--sub);font-size:12px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--field);border:1px solid var(--border);border-radius:12px;padding:4px;margin-top:14px}
.side div{text-align:center;padding:10px;border-radius:9px;font-weight:800;color:var(--sub);cursor:pointer}
.side .b.on{background:var(--up);color:#000}.side .s.on{background:var(--down);color:#fff}
label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 6px}
.presets{display:flex;gap:6px;margin-top:8px}
.presets button{flex:1;background:var(--field);border:1px solid var(--border-2);color:var(--text);border-radius:9px;padding:8px 0;font-weight:700;font-size:13px;cursor:pointer}
.quote{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 13px;margin-top:12px;font-size:13px}
.quote div{display:flex;justify-content:space-between;padding:4px 0;color:var(--sub)}
.quote b{color:var(--text)}
.fine{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:10px}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:12px}
.links a{text-decoration:none;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,10,.95);border-top:1px solid var(--border);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;color:var(--sub);font-size:11px;font-weight:700;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .i{font-size:19px}
.nav button.on{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.bal{background:linear-gradient(135deg,#1d1707,#121212);border:1px solid var(--gold-line);border-radius:16px;padding:16px;margin-bottom:12px}
.bal .l{font-size:12px;color:var(--gold-ink);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.bal .big{font-size:30px;font-weight:800;margin:4px 0 2px}
.bal .s{font-size:13px;color:var(--sub)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.25);border-top-color:#000;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="logo">Bull<span>ed</span></div>
  <div id="walletBox"></div>
</header>

<main>
  <div id="view-market">
    <div class="search">
      <input id="q" placeholder="Search coin or paste mint address" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="tabs">
      <div class="tab on" data-list="trending">🔥 Trending</div>
      <div class="tab" data-list="top">🚀 Top boosted</div>
      <div class="tab" data-list="new">🌱 New pairs</div>
    </div>
    <div id="list"><div class="empty">Loading coins…</div></div>
  </div>

  <div id="view-holdings" class="hide">
    <div id="holdings"></div>
  </div>

  <div id="view-settings" class="hide">
    <h2 style="margin:6px 0 4px">Settings</h2>
    <div class="note">Bulled never asks for your seed phrase or private key. Every trade is approved in your Phantom wallet.</div>
    <label>Custom Solana RPC URL (optional — Bulled has one built in)</label>
    <input id="set-rpc" placeholder="Using Bulled's built-in RPC" autocomplete="off" spellcheck="false">
    <label>Price protection — trade cancels if the price jumps more than this before it goes through (you're never charged extra)</label>
    <select id="set-slip">
      <option value="50">0.5%</option><option value="100">1%</option><option value="300">3%</option>
      <option value="500">5%</option><option value="1000">10%</option><option value="2000">20%</option>
    </select>
    <label>Priority fee cap (faster confirmation)</label>
    <select id="set-prio">
      <option value="100000">Low · 0.0001 SOL</option><option value="200000">Normal · 0.0002 SOL</option><option value="1000000">Fast · 0.001 SOL</option><option value="5000000">Turbo · 0.005 SOL</option>
    </select>
    <button class="btn full" style="margin-top:18px" onclick="saveSettings()">Save</button>
    <p class="fine">Settings are saved on this device only.</p>
  </div>
</main>

<nav class="nav">
  <button class="on" data-view="market"><span class="i">📈</span>Market</button>
  <button data-view="holdings"><span class="i">💼</span>Holdings</button>
  <button data-view="settings"><span class="i">⚙️</span>Settings</button>
</nav>

<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SOL_MINT = "So11111111111111111111111111111111111111112";
const TOKEN_PROGRAM = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA";
const TOKEN22_PROGRAM = "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb";
// Owner settings — your 0.45% goes to FEE_WALLET on every buy and sell.
const FEE_WALLET = "H2XUGjettEcEnRd7DVLCr9PMHJqXzP4PvjHd6qeuqbA5";  // your 0.45% goes here
const BULLED_FEE_BPS = 45;      // 0.45%
const DEFAULT_RPC = "https://mainnet.helius-rpc.com/?api-key=52f6a349-9632-473b-b3b9-66228fc1115b";
const DEX = "https://api.dexscreener.com";

// ---------- storage ----------
function ls(k, d){ try{ const v = localStorage.getItem("bulled_"+k); return v===null ? d : v; }catch{ return d; } }
function lsSet(k, v){ try{ localStorage.setItem("bulled_"+k, v); }catch{} }
const cfg = {
  get rpc(){ return ls("rpc","") || DEFAULT_RPC; },
  get slip(){ return Number(ls("slip","1000")); },
  get prio(){ return Number(ls("prio","200000")); },
};

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, ms=2600){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), ms); }
function short(a){ return a ? a.slice(0,4)+"…"+a.slice(-4) : ""; }
function usd(n){
  n = Number(n); if(!isFinite(n)) return "—";
  if(n >= 1e9) return "$"+(n/1e9).toFixed(2)+"B";
  if(n >= 1e6) return "$"+(n/1e6).toFixed(2)+"M";
  if(n >= 1e3) return "$"+(n/1e3).toFixed(1)+"K";
  return "$"+n.toFixed(n < 1 ? 2 : 0);
}
// cleaner subscript format for tiny prices: $0.0₅1234
function priceFmt(n){
  n = Number(n); if(!isFinite(n) || n===0) return "—";
  if(n >= 1) return "$"+n.toLocaleString(undefined,{maximumFractionDigits:4});
  const s = n.toFixed(14); const m = s.match(/^0\.(0*)/); const z = m ? m[1].length : 0;
  if(z >= 4){ const sub = String(z).split("").map(d=>"₀₁₂₃₄₅₆₇₈₉"[d]).join(""); return "$0.0"+sub+s.slice(2+z, 6+z); }
  return "$"+n.toPrecision(4);
}
function pct(n){ n = Number(n); if(!isFinite(n)) return '<span class="chg">—</span>'; return `<span class="chg ${n>=0?"up":"down"}">${n>=0?"+":""}${n.toFixed(1)}%</span>`; }
function ago(ts){ if(!ts) return ""; const m=(Date.now()-ts)/6e4; if(m<60) return Math.max(1,Math.round(m))+"m"; const h=m/60; if(h<48) return Math.round(h)+"h"; return Math.round(h/24)+"d"; }
async function getJSON(url, opts){ const r = await fetch(url, opts); if(!r.ok){ let t=""; try{t=await r.text();}catch{} throw new Error(r.status+" "+t.slice(0,200)); } return r.json(); }
function isMint(s){ return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(s); }

// ---------- wallet ----------
let wallet = null;      // base58 pubkey string
let solBal = null;      // SOL
function provider(){ const p = window.phantom?.solana || window.solana; return p && p.isPhantom ? p : null; }
function isMobile(){ return /iphone|ipad|ipod|android/i.test(navigator.userAgent); }
function phantomBrowseLink(){ return "https://phantom.app/ul/browse/"+encodeURIComponent(location.href)+"?ref="+encodeURIComponent(location.origin); }

function renderWallet(){
  const box = $("walletBox");
  if(wallet){
    box.innerHTML = `<div class="wallet" onclick="walletMenu()"><span class="dot"></span>${short(wallet)} <small>${solBal===null?"":solBal.toFixed(3)+" SOL"}</small></div>`;
  } else {
    box.innerHTML = `<button class="btn" onclick="connect()">Connect Phantom</button>`;
  }
}
async function connect(){
  const p = provider();
  if(!p){
    if(isMobile()){ location.href = phantomBrowseLink(); return; }
    openSheetHTML(`<button class="x" onclick="closeSheet()">×</button><h2 style="margin:0 0 8px">Phantom not found</h2>
      <p style="color:var(--sub);font-size:14px;line-height:1.5">Install the Phantom browser extension, then reload this page. On your phone, open this site inside the Phantom app's browser.</p>
      <a class="btn full" style="display:block;text-align:center;text-decoration:none" href="https://phantom.app/download" target="_blank" rel="noopener">Get Phantom</a>`);
    return;
  }
  try{
    const res = await p.connect();
    wallet = res.publicKey.toString();
    renderWallet(); refreshBalance(); toast("Wallet connected");
    if(!$("view-holdings").classList.contains("hide")) renderHoldings();
  }catch(e){ toast("Connection cancelled"); }
}
function walletMenu(){
  openSheetHTML(`<button class="x" onclick="closeSheet()">×</button><h2 style="margin:0 0 4px">Wallet</h2>
    <p style="color:var(--sub);font-size:13px;word-break:break-all">${esc(wallet)}</p>
    <div class="links"><a href="https://solscan.io/account/${esc(wallet)}" target="_blank" rel="noopener">View on Solscan ↗</a></div>
    <button class="btn ghost full" style="margin-top:16px" onclick="copyAddr()">Copy address</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="disconnect()">Disconnect</button>`);
}
function copyAddr(){ navigator.clipboard?.writeText(wallet).then(()=>toast("Address copied"), ()=>toast("Couldn't copy")); }
async function disconnect(){ try{ await provider()?.disconnect(); }catch{} wallet=null; solBal=null; renderWallet(); closeSheet(); if(!$("view-holdings").classList.contains("hide")) renderHoldings(); }

async function rpc(method, params){
  const j = await getJSON(cfg.rpc, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({jsonrpc:"2.0", id:1, method, params})});
  if(j.error) throw new Error(j.error.message || "RPC error");
  return j.result;
}
async function refreshBalance(){
  if(!wallet) return;
  try{ const r = await rpc("getBalance", [wallet, {commitment:"confirmed"}]); solBal = r.value/1e9; }
  catch{ solBal = null; }
  renderWallet();
}
async function tokenAccounts(){
  const out = {};
  for(const prog of [TOKEN_PROGRAM, TOKEN22_PROGRAM]){
    const r = await rpc("getParsedTokenAccountsByOwner", [wallet, {programId: prog}, {encoding:"jsonParsed", commitment:"confirmed"}]);
    for(const a of r.value){
      const info = a.account.data.parsed.info; const ta = info.tokenAmount;
      if(!ta || ta.amount === "0") continue;
      const cur = out[info.mint] || {mint:info.mint, raw:0n, decimals:ta.decimals};
      cur.raw += BigInt(ta.amount); out[info.mint] = cur;
    }
  }
  return Object.values(out).map(t => ({...t, ui: Number(t.raw) / 10**t.decimals}));
}
let decCache = {};
async function decimalsOf(mint){
  if(mint === SOL_MINT) return 9;
  if(decCache[mint] != null) return decCache[mint];
  try{ const r = await rpc("getTokenSupply", [mint]); decCache[mint] = r.value.decimals; return r.value.decimals; }catch{}
  return null;
}

// ---------- market data ----------
let listMode = "trending";
let pairCache = {};   // mint -> best pair
function bestPairs(pairs){
  const by = {};
  for(const p of pairs || []){
    if(p.chainId !== "solana") continue;
    const m = p.baseToken?.address; if(!m || m === SOL_MINT) continue;
    if(!by[m] || (p.liquidity?.usd||0) > (by[m].liquidity?.usd||0)) by[m] = p;
  }
  Object.assign(pairCache, by);
  return by;
}
async function pairsFor(mints){
  const res = {};
  for(let i=0; i<mints.length; i+=30){
    const chunk = mints.slice(i, i+30);
    try{ Object.assign(res, bestPairs(await getJSON(`${DEX}/tokens/v1/solana/${chunk.join(",")}`))); }catch{}
  }
  return res;
}
async function loadList(){
  const el = $("list"); el.innerHTML = `<div class="empty">Loading coins…</div>`;
  try{
    let pairs;
    if(listMode === "trending" || listMode === "top"){
      const boosts = await getJSON(`${DEX}/token-boosts/${listMode==="top"?"top":"latest"}/v1`);
      const mints = [...new Set((boosts||[]).filter(b => b.chainId === "solana").map(b => b.tokenAddress))].slice(0, 60);
      const by = await pairsFor(mints);
      pairs = mints.map(m => by[m]).filter(Boolean);
    } else {
      const prof = await getJSON(`${DEX}/token-profiles/latest/v1`);
      const mints = [...new Set((prof||[]).filter(b => b.chainId === "solana").map(b => b.tokenAddress))].slice(0, 60);
      const by = await pairsFor(mints);
      pairs = mints.map(m => by[m]).filter(Boolean).sort((a,b)=>(b.pairCreatedAt||0)-(a.pairCreatedAt||0));
    }
    renderPairs(pairs);
  }catch(e){
    el.innerHTML = `<div class="empty">Couldn't load market data.<br><button class="btn ghost" style="margin-top:12px" onclick="loadList()">Try again</button></div>`;
  }
}
function coinRow(p){
  const img = p.info?.imageUrl;
  const sym = p.baseToken.symbol || "?";
  return `<div class="row" onclick="openToken('${esc(p.baseToken.address)}')">
    ${img ? `<img class="av" src="${esc(img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<div class="av">${esc(sym[0])}</div>`}
    <div class="grow"><div class="nm">${esc(p.baseToken.name)}<span>${esc(sym)}</span></div>
      <div class="meta">${p.dexId==="pumpfun"?'<b style="color:var(--gold)">● Curve</b> · ':""}MC ${usd(p.marketCap ?? p.fdv)} · Liq ${usd(p.liquidity?.usd)} · Vol ${usd(p.volume?.h24)}${p.pairCreatedAt?" · "+ago(p.pairCreatedAt):""}</div></div>
    <div class="px"><b>${priceFmt(p.priceUsd)}</b>${pct(p.priceChange?.h24)}</div></div>`;
}
function renderPairs(pairs){
  $("list").innerHTML = pairs.length ? pairs.map(coinRow).join("") : `<div class="empty">No coins found.</div>`;
}
let qTimer;
$("q").addEventListener("input", e => {
  clearTimeout(qTimer);
  const v = e.target.value.trim();
  if(!v){ loadList(); return; }
  qTimer = setTimeout(async () => {
    if(isMint(v)){ openToken(v); return; }
    $("list").innerHTML = `<div class="empty">Searching…</div>`;
    try{
      const j = await getJSON(`${DEX}/latest/dex/search?q=${encodeURIComponent(v)}`);
      const by = bestPairs(j.pairs);
      renderPairs(Object.values(by).sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0)).slice(0,40));
    }catch{ $("list").innerHTML = `<div class="empty">Search failed. Try again.</div>`; }
  }, 350);
});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on")); t.classList.add("on");
  listMode = t.dataset.list; $("q").value = ""; loadList();
});

// ---------- token sheet ----------
let cur = null;        // {mint, pair}
let side = "buy";

async function loadRisk(mint){
  try{
    const r = await getJSON(`https://api.rugcheck.xyz/v1/tokens/${mint}/report/summary`);
    if(!cur || cur.mint !== mint) return;
    const s = r.score_normalised ?? r.score;
    const risks = (r.risks || []).slice(0, 5);
    const lvl = s == null ? "mid" : s <= 30 ? "good" : s <= 60 ? "mid" : "bad";
    const label = lvl === "good" ? "Lower risk" : lvl === "mid" ? "Caution" : "High risk";
    cur.risk = lvl;
    $("risk").outerHTML = `<div class="risk" id="risk" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center"><span>RugCheck risk${s!=null?` · ${Math.round(s)}/100`:""}</span><span class="pill ${lvl}">${label}</span></div>
      ${risks.length?`<ul>${risks.map(k=>`<li>${esc(k.name)}${k.level==="danger"?" ⚠️":""}</li>`).join("")}</ul>`:""}</div>`;
    renderTrade();
  }catch{
    const el = $("risk"); if(el) el.innerHTML = `<span>RugCheck risk</span><span class="pill mid">Unavailable</span>`;
  }
}
async function loadHolding(mint){

  }catch{}
}

const pk = s => new (W3().PublicKey)(s);
const enc = s => new TextEncoder().encode(s);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function pda(seeds, prog){ return W3().PublicKey.findProgramAddressSync(seeds, prog)[0]; }
function ataOf(owner, mint, tokenProg){ return pda([owner.toBytes(), tokenProg.toBytes(), mint.toBytes()], pk(ATA_ID)); }
function u64le(n){ const b = new Uint8Array(8); new DataView(b.buffer).setBigUint64(0, BigInt(n), true); return b; }
function ixData(disc, a, b){ const d = new Uint8Array(24); d.set(disc,0); d.set(u64le(a),8); d.set(u64le(b),16); return d; }
function b64bytes(b64){ const s = atob(b64); const u = new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function readU64(u, o){ return new DataView(u.buffer, u.byteOffset).getBigUint64(o, true); }

async function accountInfo(addr){
  const r = await rpc("getAccountInfo", [addr, {encoding:"base64", commitment:"confirmed"}]);
  if(!r.value) return null;
  return { owner: r.value.owner, data: b64bytes(r.value.data[0]) };
}
// Reads the coin's bonding curve straight from the chain.
async function loadCurve(mint){
  const m = pk(mint);
  const bcAddr = pda([enc("bonding-curve"), m.toBytes()], pk(PUMP_ID));
  const [bc, mi] = await Promise.all([accountInfo(bcAddr.toBase58()), accountInfo(mint)]);
  if(!bc || bc.data.length < 81) return null;
  const d = bc.data;
  const quoteMint = d.length >= 115 ? new (W3().PublicKey)(d.slice(83,115)) : null;
  return {
    address: bcAddr,
    vT: readU64(d,8), vS: readU64(d,16), rT: readU64(d,24), rS: readU64(d,32),
    complete: d[48] === 1,
    creator: new (W3().PublicKey)(d.slice(49,81)),
    mayhem: d.length > 81 && d[81] === 1,
    solPaired: !quoteMint || quoteMint.equals(W3().PublicKey.default) || quoteMint.toBase58() === SOL_MINT,
    baseProgram: mi?.owner || TOKEN_PROGRAM,
    decimals: mi ? mi.data[44] : 6,
  };
}
function curveTradable(c){ return c && !c.complete && c.solPaired; }

// Pricing (constant product on virtual reserves, same math as pump.fun)
function quoteBuy(c, lamportsIn){           // lamportsIn = amount going into pump.fun (fees included)
  const net = lamportsIn * 10000n / (10000n + PUMP_FEE_BPS);
  let out = c.vT - (c.vT * c.vS) / (c.vS + net);
  if(out > c.rT) out = c.rT;
  return out > 0n ? out : 0n;
}
function quoteSell(c, tokensIn){             // returns SOL after pump.fun fee
  const gross = (c.vS * tokensIn) / (c.vT + tokensIn);
  return gross - (gross * PUMP_FEE_BPS) / 10000n;
}
function bulledFee(lamports){ return lamports * BigInt(BULLED_FEE_BPS) / 10000n; }

function curveKeys(c, mint, user, isBuy){
  const W = W3(), m = pk(mint), wsol = pk(SOL_MINT), tp = pk(TOKEN_PROGRAM), bp = pk(c.baseProgram), pump = pk(PUMP_ID), pfee = pk(PFEE_ID);
  const feeRec = pk(pick(c.mayhem ? MAYHEM_RECIPIENTS : FEE_RECIPIENTS));
  const buyback = pk(pick(BUYBACK_RECIPIENTS));
  const creatorVault = pda([enc("creator-vault"), c.creator.toBytes()], pump);
  const userVol = pda([enc("user_volume_accumulator"), user.toBytes()], pump);
  const k = (pubkey, isWritable=false, isSigner=false) => ({pubkey, isWritable, isSigner});
  const keys = [
    k(pda([enc("global")], pump)),
    k(m), k(wsol), k(bp), k(tp), k(pk(ATA_ID)),
    k(feeRec, true), k(ataOf(feeRec, wsol, tp), true),
    k(buyback, true), k(ataOf(buyback, wsol, tp), true),
    k(c.address, true), k(ataOf(c.address, m, bp), true), k(ataOf(c.address, wsol, tp), true),
    k(user, true, true), k(ataOf(user, m, bp), true), k(ataOf(user, wsol, tp), true),
    k(creatorVault, true), k(ataOf(creatorVault, wsol, tp), true),
    k(pda([enc("sharing-config"), m.toBytes()], pfee)),
  ];
  if(isBuy) keys.push(k(pda([enc("global_volume_accumulator")], pump)));
  keys.push(
    k(userVol, true), k(ataOf(userVol, wsol, tp), true),
    k(pda([enc("fee_config"), pump.toBytes()], pfee)), k(pfee),
    k(pk(SYS_ID)), k(pda([enc("__event_authority")], pump)), k(pump),
  );
  return keys;
}
function createAtaIdempotent(payer, owner, mint, tokenProg){
  const W = W3();
  return new W.TransactionInstruction({ programId: pk(ATA_ID), data: Uint8Array.of(1), keys: [
    {pubkey: payer, isSigner: true, isWritable: true},
    {pubkey: ataOf(owner, mint, tokenProg), isSigner: false, isWritable: true},
    {pubkey: owner, isSigner: false, isWritable: false},
    {pubkey: mint, isSigner: false, isWritable: false},
    {pubkey: pk(SYS_ID), isSigner: false, isWritable: false},
    {pubkey: tokenProg, isSigner: false, isWritable: false},
  ]});
}
function computeIxs(){
  const W = W3(), units = 300000;
  const micro = Math.floor(cfg.prio * 1e6 / units);
  return [W.ComputeBudgetProgram.setComputeUnitLimit({units}), W.ComputeBudgetProgram.setComputeUnitPrice({microLamports: micro})];
}
async function buildTx(ixs, user){
  const W = W3();
  const {value} = await rpc("getLatestBlockhash", [{commitment:"confirmed"}]);
  const msg = new W.TransactionMessage({payerKey: user, recentBlockhash: value.blockhash, instructions: ixs}).compileToV0Message();
  return new W.VersionedTransaction(msg);
}

// Plan a trade: everything the user sees before approving.
async function planTrade(){
  const c = cur.curve;
  const raw = await rawAmount();
  if(!raw || !c) return null;
  const slip = BigInt(cfg.slip);
  if(side === "buy"){
    const fee = bulledFee(raw);
    const spend = raw - fee;
    const out = quoteBuy(c, spend);
    if(out === 0n) return null;
    return { side, total: raw, fee, spend, out, minOut: out * (10000n - slip) / 10000n };
  } else {
    const solOut = quoteSell(c, raw);
    const minSol = solOut * (10000n - slip) / 10000n;
    const fee = bulledFee(minSol);
    return { side, tokens: raw, solOut, minSol, fee, youGet: solOut - fee };
  }
}
async function executePlan(p){
  const W = W3(), user = pk(wallet), c = cur.curve, m = pk(cur.mint), feeWallet = pk(FEE_WALLET);
  const ixs = computeIxs();
  if(p.side === "buy"){
    ixs.push(createAtaIdempotent(user, user, m, pk(c.baseProgram)));
    ixs.push(W.SystemProgram.transfer({fromPubkey: user, toPubkey: feeWallet, lamports: p.fee}));
    ixs.push(new W.TransactionInstruction({programId: pk(PUMP_ID), keys: curveKeys(c, cur.mint, user, true), data: ixData(DISC.buyExactIn, p.spend, p.minOut)}));
  } else {
    ixs.push(new W.TransactionInstruction({programId: pk(PUMP_ID), keys: curveKeys(c, cur.mint, user, false), data: ixData(DISC.sell, p.tokens, p.minSol)}));
    ixs.push(W.SystemProgram.transfer({fromPubkey: user, toPubkey: feeWallet, lamports: p.fee}));
  }
  const tx = await buildTx(ixs, user);
  const {signature} = await provider().signAndSendTransaction(tx);
  return signature;
}

async function doTrade(){
  if(!wallet){ connect(); return; }
  if(!W3()){ toast("Trading library didn't load. Reload the page."); return; }
  if(!FEE_WALLET || !curveTradable(cur?.curve)) return;
  if(side === "buy" && cur.risk === "bad" && !confirm("RugCheck flags this coin as HIGH RISK. You could lose everything. Buy anyway?")) return;
  const btn = $("goBtn"); const label = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span>Preparing…`;
  try{
    cur.curve = await loadCurve(cur.mint);           // fresh reserves right before trading
    if(!curveTradable(cur.curve)) throw new Error("This coin just graduated — trade it in Phantom's Swap tab");
    const p = await planTrade();
    if(!p) throw new Error("Enter an amount first");
    if(p.side === "buy" && solBal != null && Number(p.total)/1e9 + 0.01 > solBal) throw new Error("Not enough SOL (keep ~0.01 SOL for network fees)");
    if(p.side === "sell" && (!holding || p.tokens > holding.raw)) throw new Error("You don't hold enough of this coin");
    btn.innerHTML = `<span class="spin"></span>Approve in Phantom…`;
    const sig = await executePlan(p);
    btn.innerHTML = `<span class="spin"></span>Confirming…`;
    const ok = await waitConfirm(sig);
    const mint = cur.mint;
    await Promise.all([refreshBalance(), loadHolding(mint), loadCurve(mint).then(c => { if(cur && cur.mint === mint) cur.curve = c; }).catch(()=>{})]);
    if(cur && cur.mint === mint){ renderTrade(); showResult(sig, ok); }
    else toast(ok===false ? "Trade failed" : "Trade confirmed");
  }catch(e){
    const m = String(e?.message || e);
    if(/reject|cancel|denied/i.test(m)) toast("Trade cancelled in Phantom");
    else toast(m.length > 110 ? "Trade didn't go through. Try again." : m, 4000);
  }finally{
    if(document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = label; }
  }
}
async function waitConfirm(sig){
  for(let i=0;i<30;i++){
    await new Promise(r=>setTimeout(r, 1500));
    try{
      const r = await rpc("getSignatureStatuses", [[sig], {searchTransactionHistory:false}]);
      const s = r.value[0];
      if(s?.err) return false;
      if(s && (s.confirmationStatus==="confirmed" || s.confirmationStatus==="finalized")) return true;
    }catch{ return null; }
  }
  return null;
}
function showResult(sig, ok){
  const qb = $("quoteBox");
  const txt = ok===true ? "✅ Trade confirmed" : ok===false ? "❌ Price moved too fast, so the trade was cancelled and no coins or SOL were swapped (only a tiny network fee). Try again, or raise Price protection in Settings." : "📤 Trade sent — check Solscan for confirmation";
  if(qb) qb.innerHTML = `<div class="note ${ok===false?"warn":""}" style="margin-top:12px">${txt}<br><a href="https://solscan.io/tx/${esc(sig)}" target="_blank" rel="noopener">View transaction ↗</a></div>`;
  toast(ok===true ? "Trade confirmed" : ok===false ? "Trade failed" : "Trade sent");
}

// ---------- holdings ----------
async function renderHoldings(){
  const el = $("holdings");
  if(!wallet){ el.innerHTML = `<div class="empty">Connect Phantom to see your coins.<br><button class="btn" style="margin-top:14px" onclick="connect()">Connect Phantom</button></div>`; return; }
  el.innerHTML = `<div class="empty">Loading your wallet…</div>`;
  try{
    await refreshBalance();
    const toks = await tokenAccounts();
    const by = await pairsFor(toks.map(t=>t.mint));
    const rows = toks.map(t => ({...t, pair: by[t.mint], val: t.ui * Number(by[t.mint]?.priceUsd || 0)})).sort((a,b)=>b.val-a.val);
    const solPx = await solPrice();
    const total = rows.reduce((s,r)=>s+r.val,0) + (solBal||0)*solPx;
    el.innerHTML = `<div class="bal"><div class="l">Wallet value</div><div class="big">${solPx?usd(total):"—"}</div><div class="s">${(solBal??0).toFixed(4)} SOL${solPx?" · "+usd((solBal||0)*solPx):""}</div></div>
      ${rows.length ? rows.map(r => {
        const p = r.pair, sym = p?.baseToken?.symbol || short(r.mint);
        return `<div class="row" onclick="openToken('${esc(r.mint)}')">${p?.info?.imageUrl?`<img class="av" src="${esc(p.info.imageUrl)}" alt="">`:`<div class="av">${esc(sym[0])}</div>`}
          <div class="grow"><div class="nm">${esc(p?.baseToken?.name || "Unknown")}<span>${esc(sym)}</span></div>
          <div class="meta">${r.ui.toLocaleString(undefined,{maximumFractionDigits:2})} ${esc(sym)}</div></div>
          <div class="px"><b>${p?usd(r.val):"—"}</b>${pct(p?.priceChange?.h24)}</div></div>`; }).join("") : `<div class="empty">No coins yet. Find one in Market and buy it.</div>`}`;
  }catch(e){
    el.innerHTML = `<div class="note warn">Couldn't read your wallet. The free public Solana RPC often blocks browsers — add a free RPC URL (Helius or QuickNode) in <a href="#" onclick="show('settings');return false;">Settings</a>.</div>`;
  }
}
async function solPrice(){
  try{
    const arr = await getJSON(`${DEX}/tokens/v1/solana/${SOL_MINT}`);
    const ps = (arr||[]).filter(p => p.baseToken?.address===SOL_MINT && /^(USDC|USDT)$/.test(p.quoteToken?.symbol||""));
    ps.sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0));
    return Number(ps[0]?.priceUsd || 0);
  }catch{ return 0; }
}

// ---------- nav & settings ----------
function show(v){
  ["market","holdings","settings"].forEach(x => $("view-"+x).classList.toggle("hide", x!==v));
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.view===v));
  if(v==="holdings") renderHoldings();
  if(v==="settings"){ $("set-rpc").value = ls("rpc",""); $("set-slip").value = String(cfg.slip); $("set-prio").value = String(cfg.prio); }
  window.scrollTo(0,0);
}
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => show(b.dataset.view));
function saveSettings(){
  lsSet("rpc", $("set-rpc").value.trim());
  lsSet("slip", $("set-slip").value);
  lsSet("prio", $("set-prio").value);
  toast("Settings saved"); refreshBalance();
}

// ---------- boot ----------
renderWallet();
loadList();
setTimeout(async () => {
  const p = provider();
  if(p){
    try{ const r = await p.connect({onlyIfTrusted:true}); wallet = r.publicKey.toString(); renderWallet(); refreshBalance(); }catch{}
    p.on?.("accountChanged", pk => { wallet = pk ? pk.toString() : null; solBal = null; renderWallet(); refreshBalance(); });
  }
}, 300);
</script>
